  </defs>
  <rect x="0" y="0" width="1180" height="506" fill="#ffffff"/>
  <rect x="20" y="20" width="250" height="125" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.8"/><text x="145" y="39" font-size="12.5" fill="#525252" text-anchor="middle">«interface»</text><text x="145" y="59" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">ISDKManager</text><line x1="20" y1="70" x2="270" y2="70" stroke="#171717" stroke-width="1.2"/><text x="32" y="92" font-size="14" fill="#171717">+init(context, callback)</text><text x="32" y="113" font-size="14" fill="#171717">+registerApp()</text><text x="32" y="134" font-size="14" fill="#171717">+getSDKVersion(): String</text>
