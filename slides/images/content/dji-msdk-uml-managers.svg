  <rect x="960" y="367" width="200" height="50" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.8"/><text x="1060" y="386" font-size="12.5" fill="#525252" text-anchor="middle">«interface»</text><text x="1060" y="406" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">IDJIError</text>
