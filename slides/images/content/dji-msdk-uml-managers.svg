<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 506" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="UML class diagram: SDKManager, VirtualStickManager and SimulatorManager each implement an interface, and answer through callback interfaces that fail with an IDJIError.">
