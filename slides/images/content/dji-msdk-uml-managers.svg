  <rect x="700" y="20" width="300" height="146" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.8"/><text x="850" y="39" font-size="12.5" fill="#525252" text-anchor="middle">«interface»</text><text x="850" y="59" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">ISimulatorManager</text><line x1="700" y1="70" x2="1000" y2="70" stroke="#171717" stroke-width="1.2"/><text x="712" y="92" font-size="14" fill="#171717">+enableSimulator(settings, callback)</text><text x="712" y="113" font-size="14" fill="#171717">+disableSimulator(callback)</text><text x="712" y="134" font-size="14" fill="#171717">+isSimulatorEnabled(): boolean</text><text x="712" y="155" font-size="14" fill="#171717">+setWindSpeed(windInfo)</text>
