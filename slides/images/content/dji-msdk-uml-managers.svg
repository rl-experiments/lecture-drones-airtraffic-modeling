  <rect x="330" y="20" width="310" height="146" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.8"/><text x="485" y="39" font-size="12.5" fill="#525252" text-anchor="middle">«interface»</text><text x="485" y="59" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">IVirtualStickManager</text><line x1="330" y1="70" x2="640" y2="70" stroke="#171717" stroke-width="1.2"/><text x="342" y="92" font-size="14" fill="#171717">+enableVirtualStick(callback)</text><text x="342" y="113" font-size="14" fill="#171717">+getLeftStick(): IStick</text><text x="342" y="134" font-size="14" fill="#171717">+getRightStick(): IStick</text><text x="342" y="155" font-size="14" fill="#171717">+sendVirtualStickAdvancedParam(param)</text>
