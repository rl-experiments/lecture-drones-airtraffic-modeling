  <text x="477" y="198" font-size="13" font-style="italic" fill="#525252" text-anchor="end">implements</text>
  <polyline points="850,215 850,166" fill="none" stroke="#171717" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#tri)"/>
  <text x="858" y="198" font-size="13" font-style="italic" fill="#525252" text-anchor="start">implements</text>
  <polyline points="40,145 40,340" fill="none" stroke="#171717" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#open)"/>
