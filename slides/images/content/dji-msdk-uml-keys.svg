<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 580" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-label="UML class diagram: key classes hold DJIKeyInfo constants, KeyTools turns one into a DJIKey, and KeyManager reads, writes, listens to or fires it, answering through a listener or a callback.">
