  <rect x="480" y="100" width="200" height="42" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.8"/><text x="580" y="127" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">DJIActionKeyInfo</text>
