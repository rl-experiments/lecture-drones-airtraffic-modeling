  <text x="868" y="143" font-size="13" font-style="italic" fill="#525252" text-anchor="start">extends</text>
  <polyline points="455,270 455,62" fill="none" stroke="#171717" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="447" y="200" font-size="13" font-style="italic" fill="#525252" text-anchor="end">takes</text>
  <polyline points="690,300 765,116" fill="none" stroke="#171717" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#open)"/>
