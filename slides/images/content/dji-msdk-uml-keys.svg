  <rect x="870" y="455" width="290" height="104" rx="6" fill="#ffffff" stroke="#171717" stroke-width="1.8"/><text x="1015" y="474" font-size="12.5" fill="#525252" text-anchor="middle">«interface»</text><text x="1015" y="494" font-size="16" font-weight="700" fill="#171717" text-anchor="middle">CompletionCallbackWithParam&lt;T&gt;</text><line x1="870" y1="505" x2="1160" y2="505" stroke="#171717" stroke-width="1.2"/><text x="882" y="527" font-size="14" fill="#171717">+onSuccess(value)</text><text x="882" y="548" font-size="14" fill="#171717">+onFailure(error: IDJIError)</text>
